{% extends 'timers/base.html' %}
{% load static %}

{% block title %}Countdown &mdash; Productivity Timer{% endblock %}
{% block nav_countdown %}active{% endblock %}
{% block accent %}violet{% endblock %}

{% block content %}
<section class="timer-stage">
    <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 260 260">
            <circle class="ring-track" cx="130" cy="130" r="118"></circle>
            <circle class="ring-progress" id="cd-ring" cx="130" cy="130" r="118"></circle>
        </svg>
        <div class="ring-center">
            <div class="display display--ring">
                <span id="cd-hours">00</span><span class="display-sep">:</span><span id="cd-minutes">05</span><span class="display-sep">:</span><span id="cd-seconds">00</span>
            </div>
            <div class="ring-status" id="cd-status">Ready</div>
        </div>
    </div>

    <div class="time-inputs" id="cd-inputs">
        <label class="time-field">
            <input type="number" id="cd-in-hours" min="0" max="99" value="0">
            <span>Hours</span>
        </label>
        <span class="time-inputs-sep">:</span>
        <label class="time-field">
            <input type="number" id="cd-in-minutes" min="0" max="59" value="5">
            <span>Minutes</span>
        </label>
        <span class="time-inputs-sep">:</span>
        <label class="time-field">
            <input type="number" id="cd-in-seconds" min="0" max="59" value="0">
            <span>Seconds</span>
        </label>
    </div>

    <div class="presets">
        <button class="chip" data-preset="60">1m</button>
        <button class="chip" data-preset="300">5m</button>
        <button class="chip" data-preset="600">10m</button>
        <button class="chip" data-preset="900">15m</button>
        <button class="chip" data-preset="1800">30m</button>
        <button class="chip" data-preset="3600">1h</button>
    </div>

    <div class="controls">
        <button class="btn btn-primary btn-lg" id="cd-start-btn">Start</button>
        <button class="btn btn-ghost" id="cd-reset-btn" disabled>Reset</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'timers/js/track.js' %}"></script>
<script src="{% static 'timers/js/countdown.js' %}"></script>
{% endblock %}
